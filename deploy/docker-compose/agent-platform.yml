# =============================================================================
# agent-platform B-M1 开发栈 — 扩展 foundation 底座
#
# 前置：   cd ../saas-foundation/deploy/docker-compose && docker compose -f dev.yml up -d
# 启动：   docker compose -f agent-platform.yml up -d --build
# 状态：   docker compose -f agent-platform.yml ps
# 清理：   docker compose -f agent-platform.yml down
#
# 端口：
#   BFF                    8005
#   Session Orchestrator   8006
#   Agent Scheduler        8007
#   Web (Vite dev)         5173
#   Web Fetch Gateway      8023 (宿主机映射；容器内仍 8013，避开 foundation-audit 的 8013)
# =============================================================================

name: agent-platform-dev

# --------------------------------------------------------------------------- #
# Networks
#
# We attach to the network created by the saas-foundation dev compose stack so
# we can reach pgbouncer / keycloak / otel-collector by their service names.
# The literal name "saas-foundation-dev_foundation" comes from
#   docker-compose project name "saas-foundation-dev" + network key "foundation"
# defined in ../../../saas-foundation/deploy/docker-compose/dev.yml.  Override
# via the FOUNDATION_NETWORK env var if you renamed the foundation project.
# --------------------------------------------------------------------------- #
networks:
  foundation:
    external: true
    name: ${FOUNDATION_NETWORK:-saas-foundation-dev_foundation}
  # Private network shared only between agent-scheduler and the
  # docker-socket-proxy sidecar.  Keeping it off `foundation` means the proxy
  # is not reachable from foundation services or other workloads.
  agent_internal:
    driver: bridge
    internal: true
  # Egress bridge — attached exclusively to web-fetch-gateway.  This network
  # is intentionally NOT internal so the gateway container has outbound
  # internet access (required to fetch public URLs on behalf of agents).
  # No other service joins this network; all external HTTP traffic from the
  # platform exits via web-fetch-gateway, which enforces domain allow-listing
  # and private-range blocking before forwarding the request.
  egress:
    driver: bridge

services:
  # ===========================================================================
  # Session Orchestrator — session/message/run CRUD + SSE event streams
  # ===========================================================================
  session-orchestrator:
    build:
      context: ../../services/session-orchestrator
      # Dockerfile.overlay reuses the pre-built base image (which has all
      # Poetry deps + boto3 + python-multipart installed via wheels) and only
      # swaps in the current src/. This avoids the PyPI MITM issue on rebuild
      # while keeping the image up to date with code changes.
      dockerfile: Dockerfile.overlay
    container_name: agent-session-orchestrator
    restart: unless-stopped
    environment:
      SESSION_ORCHESTRATOR_ENV: dev
      SESSION_ORCHESTRATOR_LOG_LEVEL: DEBUG
      SESSION_ORCHESTRATOR_HTTP_PORT: "8006"
      # asyncpg's prepared-statement model is incompatible with pgbouncer
      # in transaction pool mode (see ``DuplicatePreparedStatementError``).
      # The other agent-platform services already talk to ``postgres:5432``
      # directly for the same reason; route session-orchestrator the same
      # way so create_session etc. don't 500 on the first request.
      SESSION_ORCHESTRATOR_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@postgres:5432/foundation
      SESSION_ORCHESTRATOR_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      SESSION_ORCHESTRATOR_AGENT_SCHEDULER_URL: http://agent-scheduler:8007/api/scheduler/v1
      SESSION_ORCHESTRATOR_OTEL_ENABLED: "true"
      SESSION_ORCHESTRATOR_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      SESSION_ORCHESTRATOR_DB_POOL_SIZE: "5"
      SESSION_ORCHESTRATOR_DB_MAX_OVERFLOW: "10"
      SESSION_ORCHESTRATOR_DB_POOL_RECYCLE: "1800"
      # Blob storage — session attachments
      SESSION_ORCHESTRATOR_S3_BUCKET: agent-platform
      SESSION_ORCHESTRATOR_S3_REGION: us-east-1
      SESSION_ORCHESTRATOR_S3_ENDPOINT_URL: http://foundation-minio:9000
      SESSION_ORCHESTRATOR_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foundation}
      SESSION_ORCHESTRATOR_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      # Memory: knowledge-ingest URL for memory pre-fetch + write-back.
      SESSION_ORCHESTRATOR_KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8012/api/knowledge/v1
      SESSION_ORCHESTRATOR_AUTHZ_URL: http://authz:8002/api/authz/v1
      SESSION_ORCHESTRATOR_FOUNDATION_BILLING_URL: http://billing:8007/api/billing/v1
      # Redis — reads agent run hot-state (plan/step/cursor) written by the sandbox.
      # Same Redis instance the scheduler forwards into sandboxes (SCHEDULER_REDIS_URL).
      SESSION_ORCHESTRATOR_REDIS_URL: ${SCHEDULER_REDIS_URL:-redis://:redis_change_me@foundation-redis:6379/0}
    ports:
      - "${PORT_SESSION_ORCHESTRATOR:-8006}:8006"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/api/session/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # NOTE: ``pgbouncer`` is owned by the saas-foundation compose project.
    # docker-compose forbids depends_on across projects, so we rely on the
    # healthcheck above retrying until pgbouncer is reachable on the shared
    # ``foundation`` network.  Bring up the foundation stack first:
    #   cd ../../../saas-foundation/deploy/docker-compose && docker compose -f dev.yml up -d

  # ===========================================================================
  # Sandbox Pool — pre-warms microVMs (CubeSandbox) so agent runs get a
  # warm sandbox in <100ms instead of paying full cold-start latency.
  # In dev the pool is the in-memory skeleton (Pool class); production
  # swaps in the KEDA operator (B-M2 follow-up).
  # ===========================================================================
  sandbox-pool:
    build:
      context: ../../services/sandbox-pool
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
    container_name: agent-sandbox-pool
    restart: unless-stopped
    environment:
      SANDBOX_POOL_ENV: dev
      SANDBOX_POOL_LOG_LEVEL: DEBUG
      SANDBOX_POOL_HTTP_PORT: "8008"
      SANDBOX_POOL_CUBE_CONTROLLER_URL: ${CUBE_CONTROLLER_URL:-http://cube-controller:8443}
      SANDBOX_POOL_IDLE_LOW_WATERMARK: "${POOL_IDLE_LOW:-2}"
      SANDBOX_POOL_IDLE_HIGH_WATERMARK: "${POOL_IDLE_HIGH:-10}"
      SANDBOX_POOL_MAX_TOTAL: "${POOL_MAX_TOTAL:-50}"
      SANDBOX_POOL_OTEL_ENABLED: "true"
      SANDBOX_POOL_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      # Docker socket proxy — same sidecar the agent-scheduler uses.
      # The pool uses it to start/stop idle sandbox containers.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SANDBOX_POOL_SANDBOX_IMAGE: ${AGENT_IMAGE:-ghcr.io/agent-platform/agentscope-sandbox:0.1}
      SANDBOX_POOL_DOCKER_NETWORK: ${FOUNDATION_NETWORK:-saas-foundation-dev_foundation}
    ports:
      - "${PORT_SANDBOX_POOL:-8008}:8008"
    networks: [foundation, agent_internal]
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/sandbox-pool/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # docker-socket-proxy — least-privilege Docker API for the scheduler.
  #
  # The scheduler used to mount /var/run/docker.sock directly which gives a
  # compromised scheduler container root-equivalent privileges on the host.
  # tecnativa/docker-socket-proxy fronts the real socket and whitelists only
  # the API verbs we actually call (containers/images/networks).  Verbs that
  # would enable container escape (exec, bind-mount arbitrary host paths,
  # privileged: true) are left at their default 0 = deny.
  #
  # Listed as a separate "private" network so only the scheduler can reach it.
  # ===========================================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: agent-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 0
      EXEC: 0
      INFO: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [agent_internal]

  # ===========================================================================
  # Agent Scheduler — spawns sandbox containers running the AgentScope worker
  # ===========================================================================
  agent-scheduler:
    build:
      context: ../../services/agent-scheduler
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
      args:
        PIP_NO_PROXY: ${PIP_NO_PROXY:-pypi.org files.pythonhosted.org pypi.python.org}
    container_name: agent-scheduler
    restart: unless-stopped
    environment:
      SCHEDULER_ENV: dev
      SCHEDULER_LOG_LEVEL: DEBUG
      SCHEDULER_HTTP_PORT: "8007"
      # Foundation identity — used to mint per-run, scope-limited sandbox tokens.
      SCHEDULER_FOUNDATION_API_URL: http://keycloak:8080
      SCHEDULER_FOUNDATION_IDENTITY_URL: http://identity-service:8001/api/identity/v1
      # Scheduler's OWN service-account token (auth to identity).  MUST be set
      # in prod — empty here so dev compose starts; create_run will refuse to
      # spawn until a real token is supplied.
      SCHEDULER_SERVICE_TOKEN: ${SCHEDULER_SERVICE_TOKEN:-}
      # Keycloak fallback — used when SCHEDULER_SERVICE_TOKEN is unset/placeholder.
      # The scheduler bootstraps its own bearer via OIDC client_credentials so the
      # dev/CI smoke loop doesn't need an out-of-band-provisioned long-lived JWT.
      SCHEDULER_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      SCHEDULER_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-foundation}
      SCHEDULER_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-foundation-identity-service}
      SCHEDULER_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-identity-service-secret-change-me}
      # Tenant context forwarded to identity on /sessions/service-account-token.
      # Empty = use the caller's tenant (correct for B-M2 single-tenant smoke).
      SCHEDULER_TENANT_HEADER: ${SCHEDULER_TENANT_HEADER:-}
      # Sandboxes are reached via the docker-socket-proxy sidecar.  DOCKER_HOST
      # is the *only* way the docker SDK is configured here — there is NO
      # /var/run/docker.sock bind-mount on this container.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SCHEDULER_AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/agent-platform/agentscope-sandbox:0.1}
      SCHEDULER_LLM_API_KEY: ${LLM_API_KEY:-}
      SCHEDULER_LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      # Optional provider/base-URL overrides — forwarded by docker_runtime.py
      # into the sandbox container as LLM_PROVIDER / LLM_BASE_URL so the
      # AgentScope worker can target OpenAI-compatible endpoints (DeepSeek,
      # vLLM, etc.) without rebuilding the image.  Empty = provider default.
      SCHEDULER_LLM_PROVIDER: ${LLM_PROVIDER:-}
      SCHEDULER_LLM_BASE_URL: ${LLM_BASE_URL:-}
      # WORKSPACE_BASE must resolve to the SAME path on both the scheduler
      # container and the Docker daemon's host filesystem -- the scheduler
      # creates the per-run dir at this path and then asks docker-socket-proxy
      # to bind-mount that same path into the sandbox container.  A
      # ``/tmp/agent-workspaces`` host bind is the most portable choice on
      # Docker Desktop (where /tmp is shared with the daemon VM); override via
      # the ``AGENT_WORKSPACE_BASE`` env on hosts where /tmp isn't shared.
      SCHEDULER_WORKSPACE_BASE: ${AGENT_WORKSPACE_BASE:-/tmp/agent-workspaces}
      SCHEDULER_DOCKER_NETWORK: ${FOUNDATION_NETWORK:-saas-foundation-dev_foundation}
      SCHEDULER_SANDBOX_MEMORY_LIMIT: "2g"
      SCHEDULER_SANDBOX_CPU_SHARES: "1024"
      SCHEDULER_SANDBOX_TIMEOUT: "600"
      SCHEDULER_OTEL_ENABLED: "true"
      SCHEDULER_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      # B-M3: URLs forwarded to the sandbox so mcp_tenant_injector and
      # skills_loader can reach the registry services.  Override via env
      # if your compose project uses different service names / ports.
      SCHEDULER_MCP_REGISTRY_URL: ${MCP_REGISTRY_URL:-http://mcp-registry:8010/api/mcp/v1}
      SCHEDULER_SKILL_STORE_URL: ${SKILL_STORE_URL:-http://skill-store:8011/api/skills/v1}
      # Activate B-M3 extensions + web_fetch inside every sandbox container.
      # Order matters: mcp_tenant_injector first, skills_loader second,
      # web_fetch third, llm_gateway_enforcer last.
      # M1-P4: llm_gateway_enforcer routes all sandbox LLM traffic through the
      # foundation llm-gateway (tenant virtual key + quota + audit).  With it
      # present, the scheduler stops injecting the direct LLM_API_KEY into the
      # sandbox (see docker_runtime.py).  One-line rollback: drop
      # ``,llm_gateway_enforcer`` from this default (or set the RUNTIME_EXTENSIONS
      # env) and restart the scheduler — direct-connect resumes.
      SCHEDULER_RUNTIME_EXTENSIONS: ${RUNTIME_EXTENSIONS:-mcp_tenant_injector,skills_loader,web_fetch,event_audit_sink,llm_gateway_enforcer}
      # Web-fetch gateway — forwarded into sandbox as WEB_FETCH_GATEWAY_URL.
      SCHEDULER_WEB_FETCH_GATEWAY_URL: ${WEB_FETCH_GATEWAY_URL:-http://web-fetch-gateway:8013}
      # S3 credentials forwarded into sandbox for attachment download
      SCHEDULER_S3_ENDPOINT_URL: http://foundation-minio:9000
      SCHEDULER_S3_BUCKET: agent-platform
      SCHEDULER_S3_REGION: us-east-1
      SCHEDULER_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foundation}
      SCHEDULER_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      # Hot-state layer — Redis URL the scheduler forwards into each sandbox so
      # the runtime_worker can write step/plan/cursor checkpoints.
      # foundation-redis is on the saas-foundation-dev_foundation network;
      # sandbox containers share that network (SCHEDULER_DOCKER_NETWORK above)
      # so they reach foundation-redis:6379 directly without any proxy.
      # Password from foundation-redis requirepass (see saas-foundation dev.yml).
      SCHEDULER_REDIS_URL: ${SCHEDULER_REDIS_URL:-redis://:redis_change_me@foundation-redis:6379/0}
      SCHEDULER_AUTHZ_URL: http://authz:8002/api/authz/v1
      SCHEDULER_FOUNDATION_BILLING_URL: http://billing:8007/api/billing/v1
      # M1-P3: LLM gateway URL — scheduler queries GET /tenant-keys at spawn time
      # and injects LLM_GATEWAY_URL + LLM_VIRTUAL_KEY into sandbox env.
      # With llm_gateway_enforcer enabled by default, missing tenant virtual keys
      # fail sandbox spawn instead of falling back to direct provider credentials.
      SCHEDULER_LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway:8011/api/llm-gateway/v1}
      # NOTE: FOUNDATION_SERVICE_SCOPES is injected into sandbox env by the
      # scheduler as a dev-mode shim (see agent_scheduler/config.py
      # SANDBOX_SERVICE_SCOPES).  It is not an env var of the *scheduler*
      # container itself; no entry needed here.  The scheduler code builds
      # the value from the SANDBOX_SERVICE_SCOPES constant at runtime.
    ports:
      - "${PORT_AGENT_SCHEDULER:-8007}:8007"
    volumes:
      # Host-bind keeps the path identical inside the scheduler container
      # and on the Docker daemon's host -- required because the scheduler
      # tells docker-socket-proxy to bind-mount per-run subdirs by absolute
      # path, and that path must resolve on the daemon side too.
      - ${AGENT_WORKSPACE_BASE:-/tmp/agent-workspaces}:${AGENT_WORKSPACE_BASE:-/tmp/agent-workspaces}
    networks: [foundation, agent_internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/api/scheduler/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      session-orchestrator:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  # ===========================================================================
  # BFF — 认证网关 + API 聚合 + SSE 中继
  # ===========================================================================
  bff:
    build:
      context: ../../services/bff
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
    container_name: agent-bff
    restart: unless-stopped
    environment:
      BFF_ENV: dev
      BFF_LOG_LEVEL: DEBUG
      BFF_HTTP_PORT: "8005"
      # Identity service base URL.  Pre-D2 this pointed straight at keycloak
      # but the BFF actually talks to identity-service's /sessions endpoints,
      # not Keycloak's /token endpoint directly.
      BFF_FOUNDATION_IDENTITY_URL: http://identity-service:8001/api/identity/v1
      BFF_AUTHZ_URL: http://authz:8002/api/authz/v1
      BFF_FOUNDATION_ORG_URL: http://org:8003/api/org/v1
      BFF_FOUNDATION_BILLING_URL: http://billing:8007/api/billing/v1
      BFF_FOUNDATION_AUDIT_URL: http://audit:8013/api/audit/v1
      BFF_SESSION_ORCHESTRATOR_URL: http://session-orchestrator:8006/api/session/v1
      BFF_MCP_REGISTRY_URL: http://mcp-registry:8010/api/mcp/v1
      BFF_SKILL_STORE_URL: http://skill-store:8011/api/skills/v1
      BFF_KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8012/api/knowledge/v1
      BFF_SANDBOX_POOL_URL: http://sandbox-pool:8008/api/sandbox-pool/v1
      BFF_AGENT_SCHEDULER_URL: http://agent-scheduler:8007/api/scheduler/v1
      # MUST be supplied via env in any deployment beyond local dev.
      # CookieSigner refuses to start if the value looks like a placeholder.
      BFF_COOKIE_SECRET: ${BFF_COOKIE_SECRET:?BFF_COOKIE_SECRET must be set (>=32 chars, no placeholder text)}
      BFF_COOKIE_NAME: ap_session
      BFF_COOKIE_MAX_AGE: "86400"
      BFF_COOKIE_SECURE: "false"
      BFF_CORS_ORIGINS: ${BFF_CORS_ORIGINS:-http://localhost:5173,http://web:5173}
      BFF_OTEL_ENABLED: "true"
      BFF_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_BFF:-8005}:8005"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/api/bff/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      session-orchestrator:
        condition: service_healthy

  # ===========================================================================
  # Web — React 19 + Vite 开发服务器（带 HMR）
  # ===========================================================================
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: agent-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8005
    # Bind-mount the host source so Vite HMR picks up edits live; the anonymous
    # volume keeps the image's node_modules from being shadowed by the host.
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    ports:
      - "${PORT_WEB:-5173}:5173"
    networks: [foundation]
    depends_on:
      bff:
        condition: service_healthy

  # ===========================================================================
  # MCP Registry — tenant MCP server registry (B-M3)
  # ===========================================================================
  mcp-registry:
    build:
      context: ../../services/mcp-registry
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
      args:
        PIP_NO_PROXY: ${PIP_NO_PROXY:-pypi.org files.pythonhosted.org pypi.python.org}
    container_name: agent-mcp-registry
    restart: unless-stopped
    environment:
      MCP_REGISTRY_ENV: dev
      MCP_REGISTRY_LOG_LEVEL: DEBUG
      MCP_REGISTRY_HTTP_PORT: "8010"
      MCP_REGISTRY_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@postgres:5432/foundation
      MCP_REGISTRY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      MCP_REGISTRY_DB_POOL_SIZE: "5"
      MCP_REGISTRY_DB_MAX_OVERFLOW: "10"
      MCP_REGISTRY_DB_POOL_RECYCLE: "1800"
      MCP_REGISTRY_AUTHZ_URL: http://authz:8002/api/authz/v1
    ports:
      - "${PORT_MCP_REGISTRY:-8010}:8010"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/mcp/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Skill Store — versioned skill package registry (B-M3)
  # ===========================================================================
  skill-store:
    build:
      context: ../../services/skill-store
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
      args:
        PIP_NO_PROXY: ${PIP_NO_PROXY:-pypi.org files.pythonhosted.org pypi.python.org}
    container_name: agent-skill-store
    restart: unless-stopped
    environment:
      SKILL_STORE_ENV: dev
      SKILL_STORE_LOG_LEVEL: DEBUG
      SKILL_STORE_HTTP_PORT: "8011"
      SKILL_STORE_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@postgres:5432/foundation
      SKILL_STORE_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      SKILL_STORE_BLOB_BACKEND: s3
      SKILL_STORE_S3_BUCKET: agent-platform
      SKILL_STORE_S3_REGION: us-east-1
      SKILL_STORE_S3_ENDPOINT_URL: http://foundation-minio:9000
      SKILL_STORE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foundation}
      SKILL_STORE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      SKILL_STORE_DB_POOL_SIZE: "5"
      SKILL_STORE_DB_MAX_OVERFLOW: "10"
      SKILL_STORE_DB_POOL_RECYCLE: "1800"
      SKILL_STORE_AUTHZ_URL: http://authz:8002/api/authz/v1
      SKILL_STORE_FOUNDATION_BILLING_URL: http://billing:8007/api/billing/v1
    ports:
      - "${PORT_SKILL_STORE:-8011}:8011"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/skills/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Knowledge Ingest — document → embedding → pgvector pipeline (B-M3)
  # ===========================================================================
  knowledge-ingest:
    build:
      context: ../../services/knowledge-ingest
      dockerfile: Dockerfile
      additional_contexts:
        foundation_sdk: ${FOUNDATION_SDK_PATH:-../../../saas-foundation/sdks/python}
      args:
        PIP_NO_PROXY: ${PIP_NO_PROXY:-pypi.org files.pythonhosted.org pypi.python.org}
    container_name: agent-knowledge-ingest
    restart: unless-stopped
    environment:
      KNOWLEDGE_INGEST_ENV: dev
      KNOWLEDGE_INGEST_LOG_LEVEL: DEBUG
      KNOWLEDGE_INGEST_HTTP_PORT: "8012"
      KNOWLEDGE_INGEST_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@postgres:5432/foundation
      KNOWLEDGE_INGEST_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      KNOWLEDGE_INGEST_BLOB_BACKEND: s3
      KNOWLEDGE_INGEST_S3_BUCKET: agent-platform
      KNOWLEDGE_INGEST_S3_REGION: us-east-1
      KNOWLEDGE_INGEST_S3_ENDPOINT_URL: http://foundation-minio:9000
      KNOWLEDGE_INGEST_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-foundation}
      KNOWLEDGE_INGEST_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      KNOWLEDGE_INGEST_FOUNDATION_LLM_GATEWAY_URL: http://llm-gateway:8011/api/llm-gateway/v1
      KNOWLEDGE_INGEST_EMBEDDING_BACKEND: local
      KNOWLEDGE_INGEST_DB_POOL_SIZE: "5"
      KNOWLEDGE_INGEST_DB_MAX_OVERFLOW: "10"
      KNOWLEDGE_INGEST_DB_POOL_RECYCLE: "1800"
      KNOWLEDGE_INGEST_AUTHZ_URL: http://authz:8002/api/authz/v1
      KNOWLEDGE_INGEST_FOUNDATION_BILLING_URL: http://billing:8007/api/billing/v1
    ports:
      - "${PORT_KNOWLEDGE_INGEST:-8012}:8012"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/knowledge/v1/healthz').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Web Fetch Gateway — sandboxed HTTP egress for agent WebFetch tool
  #
  # Agents call WebFetchTool → gateway POST /api/web-fetch/v1/fetch.
  # The gateway enforces domain allow-listing, private-range blocking, and
  # content-type restrictions before forwarding the request externally.
  # It is on both `foundation` (reachable by sandbox containers on that net)
  # and `egress` (has outbound internet access).  No other service joins
  # `egress`, keeping the external-traffic surface minimal.
  # ===========================================================================
  web-fetch-gateway:
    build:
      context: ../../services/web-fetch-gateway
    container_name: agent-web-fetch-gateway
    restart: unless-stopped
    environment:
      WEB_FETCH_ENV: ${WEB_FETCH_ENV:-dev}
      WEB_FETCH_LOG_LEVEL: ${WEB_FETCH_LOG_LEVEL:-INFO}
      WEB_FETCH_HTTP_PORT: "8013"
      # Set to a comma-separated list of allowed domains. Empty fails closed.
      WEB_FETCH_ALLOWED_DOMAINS: ${WEB_FETCH_ALLOWED_DOMAINS:-}
      WEB_FETCH_REQUIRE_AUTH: "true"
      WEB_FETCH_REQUIRED_SCOPE: web_fetch.invoke
      WEB_FETCH_MAX_RESPONSE_BYTES: "1048576"
      WEB_FETCH_FETCH_TIMEOUT_SECONDS: "15"
      WEB_FETCH_RESTRICT_CONTENT_TYPES: "true"
    ports:
      - "${PORT_WEB_FETCH_GATEWAY:-8023}:8013"
    networks: [foundation, egress]
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8013/api/web-fetch/v1/healthz').read()"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agent_workspaces:
