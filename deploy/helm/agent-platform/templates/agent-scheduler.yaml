{{/* =============================================================================
     Agent Scheduler — Deployment + Service + ServiceAccount + HPA + PDB + NP

     特殊处理：
     1. docker runtime 时渲染 docker-socket-proxy sidecar 容器
     2. cube runtime 时渲染 cubeControllerUrl env + 无 proxy sidecar
     3. workspace volume：small/docker 用 hostPath；medium/large 推荐 PVC (RWX)
     4. agent_internal 隔离网络（docker-socket-proxy 不暴露到 foundation 网段）
        —— K8s 无"internal only"网络，等价使用 NetworkPolicy 收紧 egress
     ============================================================================= */}}

{{- if .Values.agentScheduler.enabled }}
{{- $svcName := "agent-scheduler" }}
{{- $port := .Values.agentScheduler.port | default 8007 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-platform.fullname" (dict "svcName" $svcName "root" .) }}
  labels: {{- include "agent-platform.labels" (dict "svcName" $svcName "root" .) | nindent 4 }}
spec:
  {{- if not .Values.agentScheduler.autoscaling.enabled }}
  replicas: {{ .Values.agentScheduler.replicaCount | default 1 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "agent-platform.selectorLabels" (dict "svcName" $svcName "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agent-platform.selectorLabels" (dict "svcName" $svcName "root" .) | nindent 8 }}
        app.kubernetes.io/part-of: agent-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $port | quote }}
        prometheus.io/path: /metrics
        checksum/config: {{ .Values | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-platform.fullname" (dict "svcName" $svcName "root" .) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.global.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentScheduler.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels: {{- include "agent-platform.selectorLabels" (dict "svcName" $svcName "root" $) | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        # -----------------------------------------------------------------
        # Main: agent-scheduler
        # -----------------------------------------------------------------
        - name: agent-scheduler
          image: {{ include "agent-platform.image" (dict "img" .Values.agentScheduler.image "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            {{- include "agent-platform.commonEnv" (dict "svcName" $svcName "root" .) | nindent 12 }}
            - name: SCHEDULER_HTTP_PORT
              value: {{ $port | quote }}
            {{- if eq .Values.agentScheduler.config.runtime "docker" }}
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            {{- end }}
            {{- if eq .Values.agentScheduler.config.runtime "cube" }}
            - name: SCHEDULER_CUBE_CONTROLLER_URL
              value: {{ .Values.agentScheduler.cubeControllerUrl | quote }}
            {{- end }}
            - name: SCHEDULER_AGENT_IMAGE
              value: {{ .Values.agentScheduler.config.agentImage | quote }}
            - name: SCHEDULER_LLM_MODEL
              value: {{ .Values.agentScheduler.config.llmModel | quote }}
            - name: SCHEDULER_LLM_PROVIDER
              value: {{ .Values.agentScheduler.config.llmProvider | quote }}
            - name: SCHEDULER_LLM_BASE_URL
              value: {{ .Values.agentScheduler.config.llmBaseUrl | quote }}
            - name: SCHEDULER_WORKSPACE_BASE
              value: {{ .Values.agentScheduler.config.workspaceBase | default "/tmp/agent-workspaces" | quote }}
            - name: SCHEDULER_SANDBOX_MEMORY_LIMIT
              value: {{ .Values.agentScheduler.config.sandboxMemoryLimit | quote }}
            - name: SCHEDULER_SANDBOX_CPU_SHARES
              value: {{ .Values.agentScheduler.config.sandboxCpuShares | quote }}
            - name: SCHEDULER_SANDBOX_TIMEOUT
              value: {{ .Values.agentScheduler.config.sandboxTimeout | quote }}
            - name: SCHEDULER_RUNTIME_EXTENSIONS
              value: {{ .Values.agentScheduler.config.runtimeExtensions | quote }}
            - name: SCHEDULER_KEYCLOAK_URL
              value: {{ .Values.global.foundation.keycloak.url | quote }}
            - name: SCHEDULER_KEYCLOAK_REALM
              value: {{ .Values.agentScheduler.config.keycloakRealm | quote }}
            - name: SCHEDULER_KEYCLOAK_CLIENT_ID
              value: {{ .Values.agentScheduler.config.keycloakClientId | quote }}
            - name: SCHEDULER_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentScheduler.existingSecret | default "ap-agent-scheduler-secrets" }}
                  key: SCHEDULER_KEYCLOAK_CLIENT_SECRET
            - name: SCHEDULER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentScheduler.existingSecret | default "ap-agent-scheduler-secrets" }}
                  key: SCHEDULER_SERVICE_TOKEN
            - name: SCHEDULER_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentScheduler.existingSecret | default "ap-agent-scheduler-secrets" }}
                  key: LLM_API_KEY
            # MCP / Skill Store / Web Fetch URLs (forwarded into sandbox)
            - name: SCHEDULER_MCP_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: ap-config
                  key: MCP_REGISTRY_URL
            - name: SCHEDULER_SKILL_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: ap-config
                  key: SKILL_STORE_URL
            - name: SCHEDULER_WEB_FETCH_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: ap-config
                  key: WEB_FETCH_GATEWAY_URL
            {{- with .Values.agentScheduler.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/scheduler/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/scheduler/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.agentScheduler.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: agent-workspaces
              mountPath: {{ .Values.agentScheduler.config.workspaceBase | default "/tmp/agent-workspaces" }}

        {{- if and (eq .Values.agentScheduler.config.runtime "docker") .Values.agentScheduler.dockerSocketProxy.enabled }}
        # -----------------------------------------------------------------
        # Sidecar: docker-socket-proxy
        # 隔离 Docker socket 访问；只允许 scheduler 主容器通过 localhost:2375 调用。
        # 等价于 compose 的 agent_internal 私有网络隔离。
        # K8s 中通过 NetworkPolicy 限制 scheduler pod 的出站，
        # docker-socket-proxy 以 sidecar 方式跑在同一 pod，无需独立 Service。
        # -----------------------------------------------------------------
        - name: docker-socket-proxy
          image: {{ .Values.agentScheduler.dockerSocketProxy.image | default "tecnativa/docker-socket-proxy:0.3.0" }}
          # 注意：docker-socket-proxy 需要访问 /var/run/docker.sock，
          # 必须在节点上开启 hostPath 并允许 privileged 或降级到 allowPrivilegeEscalation。
          # 生产使用 cube runtime 可完全规避此安全面。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: CONTAINERS
              value: "1"
            - name: IMAGES
              value: "1"
            - name: NETWORKS
              value: "1"
            - name: VOLUMES
              value: "0"
            - name: EXEC
              value: "0"
            - name: INFO
              value: "1"
            - name: POST
              value: "1"
          ports:
            - name: docker-proxy
              containerPort: 2375
              protocol: TCP
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
        {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- if and (eq .Values.agentScheduler.config.runtime "docker") .Values.agentScheduler.dockerSocketProxy.enabled }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
        # Workspace volume — small/docker: hostPath; medium/large: PVC (RWX)
        {{- if eq .Values.agentScheduler.workspaceVolume.type "hostPath" }}
        - name: agent-workspaces
          hostPath:
            path: {{ .Values.agentScheduler.workspaceVolume.hostPath | default "/tmp/agent-workspaces" }}
            type: DirectoryOrCreate
        {{- else if eq .Values.agentScheduler.workspaceVolume.type "pvc" }}
        - name: agent-workspaces
          persistentVolumeClaim:
            claimName: {{ .Values.agentScheduler.workspaceVolume.pvcName | default "agent-workspaces-pvc" }}
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-platform.fullname" (dict "svcName" $svcName "root" .) }}
  labels: {{- include "agent-platform.labels" (dict "svcName" $svcName "root" .) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-platform.fullname" (dict "svcName" $svcName "root" .) }}
  labels: {{- include "agent-platform.labels" (dict "svcName" $svcName "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "agent-platform.selectorLabels" (dict "svcName" $svcName "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
{{ include "agent-platform.hpa" (dict "svcName" $svcName "svc" .Values.agentScheduler "root" .) }}
{{ include "agent-platform.pdb" (dict "svcName" $svcName "svc" .Values.agentScheduler "root" .) }}
{{ include "agent-platform.networkPolicy" (dict "svcName" $svcName "svc" .Values.agentScheduler "root" . "port" $port) }}
{{- end }}
