{{/* =============================================================================
     Secrets — sensitive credential placeholders

     !! 这个文件只在本地开发 / CI 中创建 placeholder Secret。
     !! 生产环境通过 Sealed Secrets / External Secrets Operator / Vault Agent
     !!   注入真实值；此模板可通过 existingSecret 字段完全绕过。

     敏感字段清单（占位值）：
       - BFF_COOKIE_SECRET（>=32 chars）
       - SCHEDULER_SERVICE_TOKEN
       - SCHEDULER_KEYCLOAK_CLIENT_SECRET
       - LLM_API_KEY
     ============================================================================= */}}

{{- if not .Values.bff.existingSecret }}
---
# BFF 敏感配置
# 生产：用 External Secrets Operator 或 Vault 注入，然后设 bff.existingSecret=<name>
apiVersion: v1
kind: Secret
metadata:
  name: ap-bff-secrets
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: agent-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # 占位；部署前通过 --set bff.config.cookieSecret 或 existingSecret 替换
  BFF_COOKIE_SECRET: {{ .Values.bff.config.cookieSecret | default "REPLACE_ME_change_me_>=32_chars_PLACEHOLDER" | quote }}
{{- end }}

{{- if not .Values.agentScheduler.existingSecret }}
---
# Agent Scheduler 敏感配置
apiVersion: v1
kind: Secret
metadata:
  name: ap-agent-scheduler-secrets
  labels:
    app.kubernetes.io/name: agent-scheduler
    app.kubernetes.io/part-of: agent-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Scheduler service-account token（由 identity 颁发；空时 scheduler 走 OIDC 自举）
  SCHEDULER_SERVICE_TOKEN: {{ .Values.agentScheduler.config.serviceToken | default "" | quote }}
  # Keycloak OIDC client secret（OIDC 自举时必填）
  SCHEDULER_KEYCLOAK_CLIENT_SECRET: {{ .Values.agentScheduler.config.keycloakClientSecret | default "REPLACE_ME_keycloak_client_secret" | quote }}
  # LLM API key（forwarded into sandbox containers）
  LLM_API_KEY: {{ .Values.agentScheduler.config.llmApiKey | default "REPLACE_ME_llm_api_key" | quote }}
{{- end }}
