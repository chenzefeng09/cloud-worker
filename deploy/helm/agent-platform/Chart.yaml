apiVersion: v2
name: agent-platform
description: |
  Agent Platform umbrella chart. Deploys bff, session-orchestrator,
  agent-scheduler, sandbox-pool, mcp-registry, skill-store,
  knowledge-ingest, web, and web-fetch-gateway together.

  Requires the saas-foundation chart (identity/authz/org/billing/audit/
  llm-gateway/redis/postgres/minio/keycloak) to be installed first, or
  as a subchart dependency.

  Three deployment profiles:
    small:  POC / 单节点 K3s / 固定沙箱池 / 无 HA
    medium: 企业私有化 / HA / HPA / KEDA sandbox-pool
    large:  跨 AZ / Karpenter / KEDA + 严格 NetworkPolicy

  Toggle via:
    helm install agent-platform . -f values-small.yaml
    helm install agent-platform . -f values-medium.yaml
    helm install agent-platform . -f values-large.yaml

type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/chenzefeng09/agent-platform
maintainers:
  - name: Agent Platform Team
    email: platform@example.com

# =============================================================================
# Foundation 依赖
#
# 方式一（推荐生产）：foundation chart 发布到 OCI registry 后，使用 OCI ref：
#   repository: oci://registry.example.com/helm-charts
#   version: "0.1.x"
#
# 方式二（本地开发 / CI）：使用本地 file:// 路径：
#   repository: "file://../../../saas-foundation/deploy/helm/foundation"
#   version: "0.1.0"
#
# 当前使用本地 path 占位；真实部署前执行：
#   helm dependency update .
#   （或通过 Chart.lock + Nexus/Harbor OCI push 解析）
# =============================================================================
dependencies:
  - name: foundation
    version: "0.1.0"
    # 本地开发/CI：helm dependency update 会将 foundation chart 打包到 charts/
    # 注意：helm 的 file:// 解析相对于执行命令时的工作目录，不同 helm 版本行为略异。
    # 实测 helm v4.x 需要绝对路径或从对应目录执行；相对路径占位如下，实际使用时调整：
    #   repository: "file://../../../saas-foundation/deploy/helm/foundation"  # 相对占位
    # 本地开发绝对路径（CI 替换为构建机实际路径，或改用 OCI ref）：
    repository: "file://../../../saas-foundation/deploy/helm/foundation"
    # 生产 OCI registry（发布后启用）：
    # repository: oci://registry.example.com/helm-charts
    condition: foundation.enabled
    # 说明：agent-platform 把 foundation 作为可选子依赖引入。
    # 若客户已单独部署 foundation（典型企业场景），设 foundation.enabled=false
    # 并通过 global.foundation.* 指向外部端点即可。
