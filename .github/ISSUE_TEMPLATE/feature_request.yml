name: Feature request
description: Suggest an enhancement or new capability for Agent Platform.
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement to Agent Platform.

        Before you start:
        - Please search [existing issues](https://github.com/chenzefeng09/agent-platform/issues) and the
          public roadmap to avoid duplicates.
        - Agent Platform is built on top of [SaaS Foundation](https://github.com/chenzefeng09/saas-foundation).
          If your request concerns cross-cutting identity, authz, billing, or audit capabilities, it may belong on
          the SaaS Foundation repository instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Describe the use case and who it affects.
      placeholder: As a tenant admin, I cannot ... which makes it hard to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behaviour or capability you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered, and why they fall short.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Scope / affected component
      description: Which part of Agent Platform would this primarily touch?
      options:
        - "bff"
        - "session-orchestrator"
        - "agent-scheduler"
        - "sandbox-pool"
        - "app-registry"
        - "skill-store"
        - "mcp-registry"
        - "tool-broker"
        - "knowledge-ingest"
        - "cron-runner"
        - "web-fetch-gateway"
        - "Web frontend (apps/web)"
        - "Agent worker / sandbox (worker-claude-sdk, sandbox images)"
        - "Deploy (docker-compose, Helm, operator, scripts)"
        - "Cross-cutting / multiple components"
        - "Other / not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, references, or any other context that helps explain the request.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have searched existing issues and the roadmap, and this is not a duplicate.
          required: true
        - label: I am willing to help discuss the design and (optionally) contribute the implementation.
          required: false
