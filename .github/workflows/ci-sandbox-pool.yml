name: CI - Sandbox Pool
on:
  push:
    paths:
      - 'services/sandbox-pool/**'
      - '.github/workflows/ci-sandbox-pool.yml'
      - '.github/actions/setup-service/**'
  pull_request:
    paths: ['services/sandbox-pool/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: sandbox-pool, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/sandbox-pool && poetry run ruff check .
      - run: cd services/sandbox-pool && poetry run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: sandbox-pool, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/sandbox-pool && poetry run pytest --cov=src --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: sandbox-pool, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd services/sandbox-pool && poetry run pip-licenses --fail-on="GPL;AGPL"
