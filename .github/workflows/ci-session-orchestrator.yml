name: CI - Session Orchestrator
on:
  push:
    paths:
      - 'services/session-orchestrator/**'
      - '.github/workflows/ci-session-orchestrator.yml'
      - '.github/actions/setup-service/**'
  pull_request:
    paths: ['services/session-orchestrator/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: session-orchestrator, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/session-orchestrator && poetry run ruff check .
      - run: cd services/session-orchestrator && poetry run mypy src/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foundation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: session-orchestrator, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/session-orchestrator && poetry run pytest --cov=src --cov-fail-under=80
        env:
          SESSION_ORCHESTRATOR_DB_DSN: postgresql+asyncpg://postgres:postgres_test@localhost:5432/foundation

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: session-orchestrator, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd services/session-orchestrator && poetry run pip-licenses --fail-on="GPL;AGPL"
