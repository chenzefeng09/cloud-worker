name: CI - Knowledge Ingest
on:
  push:
    paths: ['services/knowledge-ingest/**', '.github/workflows/ci-knowledge-ingest.yml', '.github/actions/setup-service/**']
  pull_request:
    paths: ['services/knowledge-ingest/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: knowledge-ingest, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/knowledge-ingest && poetry run ruff check .
      - run: cd services/knowledge-ingest && poetry run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-service
        with: { service: knowledge-ingest, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - run: cd services/knowledge-ingest && poetry run pytest --cov=src --cov-fail-under=75

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-service
        with: { service: knowledge-ingest, foundation-token: '${{ secrets.FOUNDATION_REPO_TOKEN }}' }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd services/knowledge-ingest && poetry run pip-licenses --fail-on="GPL;AGPL"
