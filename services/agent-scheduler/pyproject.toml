[tool.poetry]
name = "agent-scheduler"
version = "0.1.0a1"
description = "Sandbox orchestration — spawns containers/microVMs running the AgentScope worker"
authors = ["Agent Platform Team"]
packages = [{ include = "agent_scheduler", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
docker = "^7.1.0"
boto3 = "^1.35.0"
httpx = "^0.28.0"
tomli-w = "^1.0.0"  # reserved for future config emission (B-M2); see docker_runtime.py
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
# Foundation SDK — injected at image-build time via docker-compose
# `additional_contexts: foundation_sdk` (see Dockerfile). When the internal
# PyPI is online this returns as a real dep + `[[tool.poetry.source]]`.

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
