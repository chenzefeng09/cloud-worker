[tool.poetry]
name = "agent-bff"
version = "0.1.0a1"
description = "Agent Platform BFF — auth proxy, API aggregation, SSE relay"
authors = ["Agent Platform Team"]
packages = [{ include = "agent_bff", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
httpx = "^0.28.0"
python-multipart = "^0.0.9"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
# CookieSigner + identity SDK
itsdangerous = "^2.2.0"
# BFF-local DB — notification preferences + api_keys (domain/db.py, alembic/)
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
# AsyncSession needs greenlet.  SQLAlchemy depends on it outright only on some
# CPUs (not macOS arm64) and the lock drops the asyncio-extra path, so it is
# declared here to be installed everywhere.
greenlet = ">=3.0"
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
alembic = "^1.14.0"
# GDPR erasure ledger — S3/MinIO bucket with Object Lock (domain/erasure_ledger.py)
boto3 = "^1.35.0"
# Foundation SDK — injected at image-build time via the docker-compose
# `additional_contexts: foundation_sdk` entry (see the service Dockerfile,
# which `pip install /sdk[fastapi]` before poetry runs).  When the internal
# PyPI is online this dep returns as `foundation-sdk = ">=0.1,<0.2"` with a
# `[[tool.poetry.source]]` block; until then the Dockerfile is the source.

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends/File/Form in function default args — this is the official pattern
"src/agent_bff/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# The API layer proxies httpx responses whose .json() returns Any.
# Suppressing type-arg and no-any-return for proxy endpoints is intentional —
# full typing would require Pydantic models for every upstream response shape.
[[tool.mypy.overrides]]
module = [
    "agent_bff.api.middleware",
    "agent_bff.api.v1.admin",
    "agent_bff.api.v1.api_keys",
    "agent_bff.api.v1.auth",
    "agent_bff.api.v1.billing",
    "agent_bff.api.v1.canvas",
    "agent_bff.api.v1.conversations",
    "agent_bff.api.v1.fleet",
    "agent_bff.api.v1.library",
    "agent_bff.api.v1.notifications",
    "agent_bff.api.v1.sessions",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
