# =============================================================================
# Agent Platform — Session Orchestrator OpenAPI 3.1
# =============================================================================
openapi: 3.1.0

info:
  title: Agent Platform — Session Orchestrator
  description: Session and message lifecycle management
  version: 0.1.0

servers:
  - url: http://localhost:8006
    description: Local dev

# All endpoints require a Foundation-issued bearer token by default; /healthz
# and /readyz explicitly override with `security: []` further down.
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Sessions
  # ---------------------------------------------------------------------------
  /api/session/v1/sessions:
    get:
      operationId: orchestrator_sessions_list
      summary: List sessions for current tenant
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'

    post:
      operationId: orchestrator_sessions_create
      summary: Create a new session
      tags: [Sessions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                agent_config:
                  type: object
                workspace_id:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /api/session/v1/sessions/{session_id}:
    get:
      operationId: orchestrator_sessions_get
      summary: Get session detail
      tags: [Sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: orchestrator_sessions_update
      summary: Update session
      tags: [Sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                status: { $ref: '#/components/schemas/SessionStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

    delete:
      operationId: orchestrator_sessions_delete
      summary: Soft-delete session
      tags: [Sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted

  # ---------------------------------------------------------------------------
  # Messages
  # ---------------------------------------------------------------------------
  /api/session/v1/sessions/{session_id}/messages:
    get:
      operationId: orchestrator_messages_list
      summary: List messages in a session
      tags: [Messages]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'

    post:
      operationId: orchestrator_messages_create
      summary: Add a message to a session
      tags: [Messages]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, content]
              properties:
                role:
                  type: string
                  enum: [USER, ASSISTANT, SYSTEM, TOOL]
                content:
                  type: string
                tool_calls:
                  type: object
                run_id:
                  type: string
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ---------------------------------------------------------------------------
  # Runs
  # ---------------------------------------------------------------------------
  /api/session/v1/sessions/{session_id}/runs:
    get:
      operationId: orchestrator_runs_list
      summary: List runs for a session
      tags: [Runs]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'

    post:
      operationId: orchestrator_runs_create
      summary: Start a new run (relays to agent-scheduler)
      tags: [Runs]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task:
                  type: string
                  description: Task description for the agent
                agent_config:
                  type: object
                workspace_file_ids:
                  type: array
                  items:
                    type: string
                  description: >-
                    Optional workspace-file ids (wsf_…) the user @-referenced in
                    this message. The referenced files are hoisted to the front of
                    the injected workspace-file context (each group keeps its
                    original relative order) so the MAX_WORKSPACE_FILES / character
                    budget truncation falls on the un-referenced tail first. Ids
                    not in the session's workspace file set are silently ignored;
                    a non-list value or non-string elements are ignored (never a
                    400).
                message:
                  type: object
                  nullable: true
                  additionalProperties: false
                  required: [content]
                  description: >-
                    The user message that starts this turn. It is written in the
                    run's own transaction (needs `session.message.create`), so a
                    run that is refused or cannot start leaves no unanswered
                    message behind. Omit it when the turn's message is already in
                    the transcript (a task retry) or the run has no user turn
                    (App and scheduled runs).
                  properties:
                    content: { type: string }
                    attachment_ids:
                      type: array
                      items: { type: string }
      responses:
        '201':
          description: Run created and started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Run'
                  - type: object
                    properties:
                      message:
                        description: The turn's user message, when the request carried one.
                        allOf:
                          - $ref: '#/components/schemas/Message'
        '409':
          description: >-
            A run is already in progress in this session (one live run per
            session; concurrent starts are serialized on the session row).
            Nothing of the turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: >-
            `code: AGENT.RUN.QUOTA_EXCEEDED`. The scheduler refused the run
            because the tenant's agent run quota is used up. `user_message` says
            so for the user; retrying does not help. Nothing of the turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Request validation failed (a malformed `message` included), or
            `code: AGENT.RUN.LLM_NOT_CONFIGURED`: the tenant has no enabled LLM
            provider. `user_message` tells the user
            an administrator has to add one; retrying does not help. Nothing of
            the turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            The scheduler refused the run for any other reason. Its body is not
            relayed (it may carry internal details); `detail` names its status.
            Nothing of the turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The scheduler is unreachable. Nothing of the turn is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/session/v1/sessions/{session_id}/pending:
    get:
      operationId: orchestrator_session_pending
      summary: List currently-paused HITL interactions across the session's runs
      description: >-
        Best-effort mount-time pull so the frontend can rehydrate ConfirmCard /
        QuestionCard for a run paused while the page was closed. Always 200 with
        a (possibly empty) items array; never 404/500. Reads the Redis
        agent:run:{run_id}:paused blob per run (authoritative pause signal).
      tags: [Runs]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Paused interactions (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: string }
                        kind:
                          type: string
                          enum: [confirm, answer, question]
                        tool_calls:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string, nullable: true }
                              args: { type: string, nullable: true }
                        question: { type: string, nullable: true }
                        paused_at: { type: string, nullable: true }

  /api/session/v1/sessions/{session_id}/runs/{run_id}:
    get:
      operationId: orchestrator_runs_get
      summary: Get run status
      tags: [Runs]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'

  /api/session/v1/sessions/{session_id}/runs/{run_id}/cancel:
    post:
      operationId: orchestrator_runs_cancel
      summary: Cancel a run
      tags: [Runs]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'

  # ---------------------------------------------------------------------------
  # SSE Stream
  # ---------------------------------------------------------------------------
  /api/session/v1/sessions/{session_id}/stream:
    get:
      operationId: orchestrator_session_stream
      summary: Session-scoped multiplexing SSE stream
      description: >
        Holds the HTTP connection open for the lifetime of the session view and
        surfaces events from whatever run is currently active, including runs that
        start after the connection is opened. Unlike the legacy per-run stream
        (removed), this endpoint never closes on run completion — it keeps waiting
        for the next run.

        **Event names emitted:**

        - `run_started`          — a new run has become active on this session.
        - `token`                — incremental assistant text delta (from Redis stream).
        - `tool`                 — tool call / result (from Redis stream).
        - `thinking`             — reasoning text (from Redis stream).
        - `plan`                 — structured plan-steps update.
        - `message`              — newly persisted message row.
        - `pending_confirmation` — run paused waiting for user to confirm a tool call.
        - `pending_question`     — run paused waiting for a free-text answer.
        - `run_paused`           — run entered HITL pause state.
        - `run_complete`         — active run reached a terminal state.
        - `done`                 — stream deadline exhausted; client should reconnect.
        - `error`                — unexpected server error; detail is opaque.
      tags: [Messages]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Workspaces
  # ---------------------------------------------------------------------------
  /api/session/v1/workspaces:
    get:
      operationId: orchestrator_workspaces_list
      summary: List workspaces for the current user (lazy-creates the default)
      tags: [Workspaces]
      responses:
        '200':
          description: Workspace list (ascending by created_at)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'

    post:
      operationId: orchestrator_workspaces_create
      summary: Create a workspace
      tags: [Workspaces]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 500, nullable: true }
                instructions: { type: string, nullable: true }
                skills:
                  type: array
                  items: { type: string }
                meta: { type: object }
                sensitivity_level: { type: string, enum: [L1, L2, L3, L4, L5], default: L2 }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'

  /api/session/v1/workspaces/{workspace_id}:
    get:
      operationId: orchestrator_workspaces_get
      summary: Get workspace detail
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: orchestrator_workspaces_update
      summary: Update workspace
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 500, nullable: true }
                instructions: { type: string, nullable: true }
                skills:
                  type: array
                  items: { type: string }
                meta: { type: object }
                sensitivity_level: { type: string, enum: [L1, L2, L3, L4, L5] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: orchestrator_workspaces_delete
      summary: Soft-delete workspace (409 for the default workspace)
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Default workspace cannot be deleted

  /api/session/v1/workspaces/{workspace_id}/files:
    get:
      operationId: orchestrator_workspace_files_list
      summary: List workspace base files
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Workspace file list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFilePage'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: orchestrator_workspace_files_upload
      summary: Upload a base file into the workspace
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
                  maxLength: 500
                sensitivity_level:
                  type: string
                  enum: [L1, L2, L3, L4, L5]
                  default: L2
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFile'
        '413':
          description: File exceeds the workspace file size limit
        '503':
          $ref: '#/components/responses/DlpUnavailable'

  /api/session/v1/workspaces/{workspace_id}/files/{file_id}:
    delete:
      operationId: orchestrator_workspace_files_delete
      summary: Delete a workspace file (row + best-effort blob)
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
        - name: file_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/session/v1/workspaces/{workspace_id}/files/{file_id}/content:
    get:
      operationId: orchestrator_workspace_files_content
      summary: Download workspace file bytes (RFC 6266 Content-Disposition)
      tags: [Workspaces]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string }
        - name: file_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw file bytes with original Content-Type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: |
            The file's sensitivity level exceeds the caller's clearance, or
            foundation-dlp `check:download` denied it (`detail` is
            `DLP: <reason>`).
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DlpUnavailable'

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /api/session/v1/healthz:
    get:
      operationId: orchestrator_healthz
      summary: Liveness check
      tags: [Health]
      responses:
        '200':
          description: The service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/session/v1/readyz:
    get:
      operationId: orchestrator_readyz
      summary: Readiness check
      tags: [Health]
      responses:
        '200':
          description: The service is ready to take requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Foundation-issued OIDC JWT; gateway verifies via Keycloak JWKS.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant scope, injected by the API gateway from the JWT ``tenant_id``
        claim.  Clients cannot self-declare a tenant id.
      schema:
        type: string
        pattern: '^tnt_[0-9A-Z]{26}$'
    UserIdHeader:
      name: X-User-Id
      in: header
      required: false
      description: Calling user id (gateway-injected); absent for service tokens.
      schema:
        type: string
        pattern: '^usr_[0-9A-Z]{26}$|^SYSTEM$'

  schemas:
    SessionStatus:
      type: string
      enum: [ACTIVE, PAUSED, COMPLETED, ERROR, ARCHIVED]

    RunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED]

    Session:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        title: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SessionStatus' }
        current_run_id: { type: string, nullable: true }
        workspace_id: { type: string, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM, TOOL] }
        content: { type: string }
        tool_calls: { type: object, nullable: true }
        run_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        sequence: { type: integer }

    Run:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        sandbox_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RunStatus' }
        task_description: { type: string }
        result_summary: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Workspace:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        is_default: { type: boolean }
        meta: { type: object }
        sensitivity_level: { type: string, enum: [L1, L2, L3, L4, L5], default: L2 }
        file_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceFile:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        filename: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
        description: { type: string, nullable: true }
        sensitivity_level: { type: string, enum: [L1, L2, L3, L4, L5], default: L2 }
        created_at: { type: string, format: date-time }

    WorkspacePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    WorkspaceFilePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFile'

    SessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor: { type: string, nullable: true }

    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor: { type: string, nullable: true }

    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [OK, DEGRADED, DOWN] }
        service: { type: string }
        version: { type: string }

    Error:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        user_message:
          type: string
          description: >-
            English text for the user, on the orchestrator's own errors.
            Defaults to `detail`, which is written for operators, unless the
            error sets its own.

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DlpUnavailable:
      description: |
        `code: AGENT.DLP.UNAVAILABLE`. The foundation-dlp scan (upload) or
        `check:download` (download) could not be completed (network error,
        timeout, non-2xx, unreadable answer) and
        `SESSION_ORCHESTRATOR_DLP_FAILURE_MODE` is `closed`, the default. A
        refused upload stores nothing; a refused download serves no bytes.
        Retry later. In `open` mode the request proceeds unchecked instead,
        with an ERROR log. See contracts/worker-wire-contract.md §8.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
