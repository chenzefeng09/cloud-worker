[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-ext"
version = "0.1.0a1"
description = "AgentScope integration glue for the agent-platform sandbox image"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Agent Platform Team" }]
license = { text = "Apache-2.0" }
# Pinned to AgentScope 2.x — the public ReActAgent / Toolkit / MsgHub
# surface this package targets is what 2.0 froze.  Quarterly bumps are
# tracked in sandbox-images/.
dependencies = [
    "agentscope>=2.0,<3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
agent-worker = "agentscope_ext.runtime_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["agentscope_ext*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
