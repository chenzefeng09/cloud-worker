[project]
name = "agent-platform-conformance"
version = "0.1.0"
description = "B-M1 conformance test suite"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
